# Netlify configuration for LUMI — The Dream Repair Atelier
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Every page of Lumi's site (/story, /playroom, ...) is served by the single-page app;
# /api/* functions declare their own paths and are matched before this rewrite.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
