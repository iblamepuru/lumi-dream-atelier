<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4C96B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F4C96B" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" />
    </filter>
  </defs>
  <!-- Background Glow -->
  <circle cx="32" cy="32" r="30" fill="#29213F" />
  <circle cx="32" cy="32" r="24" fill="url(#glow)" opacity="0.3" />

  <!-- Upper Wings -->
  <ellipse cx="20" cy="24" rx="12" ry="16" fill="#B9A5E8" transform="rotate(-25 20 24)" />
  <ellipse cx="44" cy="24" rx="12" ry="16" fill="#B9A5E8" transform="rotate(25 44 24)" />
  
  <!-- Wing crescent marks -->
  <path d="M18 16 A 4 4 0 0 1 24 24 A 6 6 0 0 0 18 16" fill="#F4C96B" opacity="0.9" />
  <path d="M46 16 A 4 4 0 0 0 40 24 A 6 6 0 0 1 46 16" fill="#F4C96B" opacity="0.9" />

  <!-- Lower Wings -->
  <ellipse cx="22" cy="38" rx="8" ry="11" fill="#9D88D2" transform="rotate(-15 22 38)" />
  <ellipse cx="42" cy="38" rx="8" ry="11" fill="#9D88D2" transform="rotate(15 42 38)" />

  <!-- Body -->
  <ellipse cx="32" cy="35" rx="8" ry="12" fill="#FFF8F1" />
  
  <!-- Scarf -->
  <path d="M26 31 Q 32 35 38 31 Q 39 36 32 37 Q 25 36 26 31 Z" fill="#D995B7" />
  <rect x="33" y="34" width="4" height="8" rx="2" fill="#D995B7" transform="rotate(10 33 34)" />

  <!-- Eyes -->
  <circle cx="29" cy="27" r="2.2" fill="#5C4033" />
  <circle cx="35" cy="27" r="2.2" fill="#5C4033" />
  <circle cx="28.5" cy="26.3" r="0.7" fill="#FFFFFF" />
  <circle cx="34.5" cy="26.3" r="0.7" fill="#FFFFFF" />
  
  <!-- Cheeks -->
  <circle cx="27" cy="29.5" r="1.5" fill="#D995B7" opacity="0.6" />
  <circle cx="37" cy="29.5" r="1.5" fill="#D995B7" opacity="0.6" />

  <!-- Antennae -->
  <path d="M30 20 Q 25 12 21 13" stroke="#F4C96B" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <path d="M34 20 Q 39 12 43 13" stroke="#F4C96B" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <path d="M21 11 A 2 2 0 0 1 20 15 A 3 3 0 0 0 21 11" fill="#F4C96B" />
  <path d="M43 11 A 2 2 0 0 0 44 15 A 3 3 0 0 1 43 11" fill="#F4C96B" />

  <!-- Lantern in hand -->
  <rect x="42" y="34" width="8" height="11" rx="2" fill="#D4AF37" />
  <rect x="44" y="36" width="4" height="7" rx="1" fill="#FFF8F1" />
  <circle cx="46" cy="39.5" r="2.5" fill="#F4C96B" filter="url(#soft)" />
  <polygon points="46,38 46.8,39.3 48.3,39.5 47.1,40.5 47.5,42 46,41.1 44.5,42 44.9,40.5 43.7,39.5 45.2,39.3" fill="#FFF8F1" />
</svg>